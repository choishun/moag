<!DOCTYPE html>
<!--
  created.html - 모임 생성 완료 (주최자 전용 화면)
  "모임 만들기" 버튼을 누르면 오는 화면입니다. 주소: created.html?id=모임아이디&key=관리키
  - 응답 링크: 참여자들에게 공유하는 주소
  - 관리 링크: 주최자가 결과를 보고 확정하는 주소
  동작 코드는 js/created.js 에 있어요.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모임 생성 완료 · 모아그</title>
  <link rel="icon" href="images/favicon.png" type="image/png">
  <meta name="theme-color" content="#16a34a">
  <!-- 주최자 전용 화면이라 공유 미리보기(OG 태그)는 넣지 않아요 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">

    <!-- ===== 공통 헤더 (만들기 흐름의 일부라서 '만들기' 이름표) ===== -->
    <header class="header">
      <a href="index.html" class="logo"><img class="logo-icon" src="images/logo.png" alt="">모아그</a>
      <span class="page-label">만들기</span>
    </header>

    <main class="main">
      <!-- 완료 표시 -->
      <div class="done-icon">✓</div>
      <h1 class="page-title center">모임이 만들어졌어요!</h1>
      <p class="page-desc center">아래 링크를 참여자들에게 보내 주세요.</p>

      <!-- 만든 모임 요약 (JS 가 채움) -->
      <div class="info-box">
        <strong id="info-name">불러오는 중...</strong>
        <span id="info-detail"></span>
      </div>

      <!-- ===== 1. 응답 링크 (참여자용) ===== -->
      <section class="section">
        <span class="section-title">📨 응답 링크 <small class="tag">참여자에게 공유</small></span>

        <!-- 링크 칸 + 복사 버튼을 한 줄에 -->
        <div class="link-row">
          <!-- readonly = 볼 수만 있고 수정은 안 되는 입력칸 -->
          <input class="input" id="respond-link" type="text" readonly aria-label="응답 링크">
          <button class="btn-copy" id="copy-respond" type="button">복사</button>
        </div>

        <!-- 버튼 두 개를 나란히: 응답 페이지 열기 | 결과 확인 -->
        <div class="btn-row">
          <a class="btn btn-outline" id="open-respond" href="#">응답 페이지 열기</a>
          <a class="btn" id="open-result" href="#">결과 확인</a>
        </div>
      </section>

      <!-- ===== 2. 관리 링크 (주최자용) ===== -->
      <section class="section">
        <span class="section-title">🔒 관리 링크 <small class="tag gray">주최자 전용</small></span>
        <div class="link-row">
          <input class="input" id="admin-link" type="text" readonly aria-label="관리 링크">
          <button class="btn-copy" id="copy-admin" type="button">복사</button>
        </div>
        <p class="hint">이 주소로 들어오면 결과를 보고 시간을 확정할 수 있어요.
          꼭 복사해서 나만 보관하세요! 잃어버리면 다시 찾을 수 없어요.</p>
      </section>

      <div class="btn-group">
        <a class="btn btn-outline" href="index.html">새 모임 하나 더 만들기</a>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/created.js"></script>
</body>
</html>
